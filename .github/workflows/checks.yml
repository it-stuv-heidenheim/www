# The local checks (docs/testing.md) on every push and PR; deploy.yml runs them first. No secrets.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned; to raise it, run `npx prettier@<new> --write .` and commit both.
      - name: Formatting
        run: npx --yes prettier@3.9.10 --check .

      - name: Site rules and tool tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Plugin tests
        run: |
          php wp-plugin/tests/test_normalize.php
          php wp-plugin/tests/test_cache.php
          php wp-plugin/tests/test_theme.php
          php wp-plugin/tests/test_ics.php
          TZ=America/Los_Angeles node --test 'wp-plugin/tests/*.test.js'

      - name: Skill tests
        working-directory: .agents/skills/wordpress-default-editor
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider

      - name: Block validation
        run: |
          BLOCKCHECK=.agents/skills/wordpress-default-editor/scripts/blockcheck
          npm install --prefix "$BLOCKCHECK" --silent --no-audit --no-fund
          node "$BLOCKCHECK/validate_blocks.cjs" $(git ls-files 'data/*.html') \
            | tee "$RUNNER_TEMP/blockcheck.log"
          # One summary line per file, or the validator crashed.
          test "$(grep -c '^===' "$RUNNER_TEMP/blockcheck.log")" \
            -eq "$(git ls-files 'data/*.html' | wc -l)"
          ! grep -E ': [1-9][0-9]* invalid' "$RUNNER_TEMP/blockcheck.log"

      - name: Deploy dry run
        run: python3 .agents/skills/wordpress-default-editor/scripts/deploy.py --manifest data/manifest.json all --dry-run

      - name: Icon CSS matches Phosphor
        run: |
          npm install --prefix "$RUNNER_TEMP/phosphor" --silent @phosphor-icons/core@2.1.1
          PHOSPHOR_ICON_DIR="$RUNNER_TEMP/phosphor/node_modules/@phosphor-icons/core/assets/regular" \
            python3 tools/gen_icon_css.py --check
