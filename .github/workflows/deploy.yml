# Deploys data/ to the live site. Started by hand only (Actions → Deploy → Run
# workflow, or `gh workflow run deploy.yml`): a push runs checks.yml and nothing
# else, so pushes collect on main until someone deploys them, and one run with
# `changed` takes them all. The deploy job still waits for a required reviewer
# of the `production` environment before it writes: docs/ai-workflow.md,
# "Deploy per GitHub Action".
# Needs that environment with the secrets WP_USER and WP_APP_PASS and the
# variable WP_SITE (with https://).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "changed, all, or target names from data/manifest.json (space-separated)"
        default: changed
        required: true
      overwrite:
        description: "targets edited in wp-admin whose edit may be overwritten (space-separated, or all)"
        default: ""
        required: false

# One deploy at a time; a second run waits instead of interleaving writes. A
# run waiting for approval holds the group too: reject a run you will not
# approve, or the next one queues behind it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WP_SITE }}
    env:
      WP_SITE: ${{ vars.WP_SITE }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
      WP_REST_ROOT: wp-json
      # The host publishes an AAAA record it does not route (SKILL.md).
      WP_ADDRESS_FAMILY: ipv4
      # Through env, never `${{ }}` inside a script: no shell injection.
      TARGET: ${{ inputs.target || 'changed' }}
      OVERWRITE: ${{ inputs.overwrite }}
      MANIFEST: data/manifest.json
      SKILL_SCRIPTS: .agents/skills/wordpress-default-editor/scripts
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a live target that matches an older commit is behind
          # and safe to overwrite; one that matches none was edited in wp-admin.
          fetch-depth: 0

      - name: Configuration present
        run: |
          for v in WP_SITE WP_USER WP_APP_PASS; do
            [ -n "${!v}" ] || { echo "::error::$v is not set in the production environment"; exit 1; }
          done

      - name: Dry run
        run: python3 "$SKILL_SCRIPTS/deploy.py" --manifest "$MANIFEST" all --dry-run

      # Each target is BEHIND (the site serves an older commit, nothing is
      # lost) or EDITED (content no commit has: an edit in wp-admin, which a
      # deploy would destroy). `changed` deploys both kinds, but any EDITED
      # target that is to be written stops the run before the first write,
      # unless it is listed under `overwrite`. The diff in the log shows the
      # edit. Media cannot be diffed and always runs; it only uploads files
      # that are not in the library yet.
      - name: Pick targets
        run: |
          set +e
          out=$(python3 "$SKILL_SCRIPTS/verify_deploy.py" --manifest "$MANIFEST" --diff --history)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 2 ] || { echo "::error::live site not readable"; exit 1; }
          edited=$(echo "$out" | awk '$1 == "EDITED" { print $2 }')
          if [ "$TARGET" = changed ]; then
            names="media $(echo "$out" | awk '$1 == "BEHIND" { print $2 }') $edited"
          else
            names="$TARGET"
          fi
          set -f  # no glob expansion of the inputs
          names=$(echo $names)
          overwrite=$(echo $OVERWRITE)
          case "$names $overwrite" in *[!a-z0-9\ -]*) echo "::error::bad target list: $names / $overwrite"; exit 1 ;; esac
          blocked=""
          for n in $edited; do
            case " $names " in *" $n "*|*" all "*) ;; *) continue ;; esac
            case " $overwrite " in *" $n "*|*" all "*) ;; *) blocked="$blocked $n" ;; esac
          done
          if [ -n "$blocked" ]; then
            msg="Edited in wp-admin, nothing deployed:$blocked. Port the edit (diff in the log) into data/, or run by hand with overwrite:$blocked"
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NAMES=$names" >> "$GITHUB_ENV"
          echo "OVERWRITE_NAMES=$overwrite" >> "$GITHUB_ENV"
          echo "Deploying: $names" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$overwrite" ] || echo "Overwriting wp-admin edits in: $overwrite" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        run: |
          set -f
          for n in $NAMES; do
            # deploy.py checks again and refuses an EDITED target itself.
            case " $OVERWRITE_NAMES " in *" $n "*|*" all "*) flag=--overwrite ;; *) flag= ;; esac
            python3 "$SKILL_SCRIPTS/deploy.py" --manifest "$MANIFEST" "$n" $flag
          done

      - name: Verify
        run: |
          case " $NAMES " in
            *" all "*) python3 "$SKILL_SCRIPTS/verify_deploy.py" --manifest "$MANIFEST" --diff ;;
            *) for n in $NAMES; do
                 python3 "$SKILL_SCRIPTS/verify_deploy.py" --manifest "$MANIFEST" --diff "$n"
               done ;;
          esac

      - name: Verify global CSS
        if: contains(format(' {0} ', env.NAMES), ' global-styles ') || contains(format(' {0} ', env.NAMES), ' all ')
        run: |
          python3 "$SKILL_SCRIPTS/verify_global_css.py" \
            --marker .stuv-card --marker .stuv-icon-box \
            --marker ":root.dark" --marker .stuv-wpforms \
            --marker .stuv-body-muted \
            --icon-marker=--ico-calendar

      # The runner's /tmp is gone after the run; keep the pre-write backups
      # so rollback.py can still restore from them (docs/testing.md).
      - name: Keep backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-backup-${{ github.run_number }}
          path: /tmp/wp_backup
          if-no-files-found: ignore
          retention-days: 30
