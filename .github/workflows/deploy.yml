# Deploys data/ by hand only (`gh workflow run deploy.yml`), after the `production` reviewer
# approves. Needs the secrets WP_USER, WP_APP_PASS and the variable WP_SITE (with https://).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "changed, all, or target names from data/manifest.json (space-separated)"
        default: changed
        required: true
      overwrite:
        description: "targets edited in wp-admin whose edit may be overwritten (space-separated, or all)"
        default: ""
        required: false

# One deploy at a time. A run waiting for approval holds the group: reject it or the next queues.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WP_SITE }}
    env:
      WP_SITE: ${{ vars.WP_SITE }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
      WP_REST_ROOT: wp-json
      # The host publishes an AAAA record it does not route (SKILL.md).
      WP_ADDRESS_FAMILY: ipv4
      # Inputs go through env: `${{ }}` inside a script allows shell injection.
      TARGET: ${{ inputs.target || 'changed' }}
      OVERWRITE: ${{ inputs.overwrite }}
      MANIFEST: data/manifest.json
      SKILL_SCRIPTS: .agents/skills/wordpress-default-editor/scripts
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, to tell BEHIND from EDITED.
          fetch-depth: 0

      - name: Configuration present
        run: |
          for v in WP_SITE WP_USER WP_APP_PASS; do
            [ -n "${!v}" ] || { echo "::error::$v is not set in the production environment"; exit 1; }
          done

      # deploy.py stops on an EDITED target not listed under `overwrite`. `--` ends the options.
      - name: Deploy
        shell: bash
        run: |
          set -f
          python3 -u "$SKILL_SCRIPTS/deploy.py" --manifest "$MANIFEST" \
            ${OVERWRITE:+--overwrite "$OVERWRITE"} -- $TARGET 2>&1 \
            | tee "$RUNNER_TEMP/deploy.log"

      - name: Summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/deploy.log" ] || exit 0
          { echo '```text'; grep -iE '^Deploying:|error: ' "$RUNNER_TEMP/deploy.log"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      # Keep the pre-write backups for rollback.py; the runner's /tmp is gone afterwards.
      - name: Keep backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-backup-${{ github.run_number }}
          path: /tmp/wp_backup
          if-no-files-found: ignore
          retention-days: 30
